<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="82%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#bde85a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#bde85a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#3c2d1f"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#271d14"/>
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.35"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark: dark rounded square + lime circle, matching Logo in Page.tsx -->
  <g transform="translate(90, 88)">
    <rect width="72" height="72" rx="20" fill="#fbfaf5" fill-opacity="0.08"/>
    <rect width="72" height="72" rx="20" fill="none" stroke="#e0cdb6" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="13" fill="#bde85a"/>
  </g>

  <text x="184" y="145" font-family="Bricolage Grotesque, sans-serif" font-size="44" font-weight="800" fill="#fbfaf5">
    Pato<tspan fill="#bde85a">Rate</tspan>
  </text>

  <text x="90" y="290" font-family="Bricolage Grotesque, sans-serif" font-size="58" font-weight="800" fill="#fbfaf5" letter-spacing="-0.01em">
    <tspan x="90" dy="0">Робимо так, щоб бізнес</tspan>
    <tspan x="90" dy="68">знаходили і обирали</tspan>
  </text>

  <text x="90" y="430" font-family="Manrope, sans-serif" font-size="26" fill="#e0cdb6">
    <tspan x="90" dy="0">Відгуки · Google Карти · Ведення бізнесу · Лендінги</tspan>
  </text>

  <!-- Bottom accent bar -->
  <rect x="90" y="490" width="120" height="6" rx="3" fill="#bde85a"/>
</svg>
